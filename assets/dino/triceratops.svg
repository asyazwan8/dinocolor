<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"
     data-artwork="/assets/dino/triceratops.png">
  <!--
    Dino Colourise - Triceratops rig definition.

    The printed artwork is the PNG named in data-artwork. This file does NOT draw the
    dinosaur; it only says which bone each region of that drawing belongs to.

    Why it is split that way. A mask hand-traced around a raster outline is wrong in
    one direction or the other: overshoot the ink and bare paper becomes part of the
    animal, undershoot and the outline is clipped. So buildRig derives the silhouette
    from the artwork itself, by flooding inwards from the border - everything the
    flood cannot reach is the dinosaur. Each part's mask is then that silhouette
    intersected with the polygon below, which means the OUTER edge always follows the
    printed line exactly and these polygons only have to be right about where one
    bone hands over to the next. Those boundaries are interior, so being a few pixels
    out is invisible.

    Polygons may overlap, and at the joints they should: draw order resolves it, and
    the overlap is what stops a rotation opening a gap. Between them they must cover
    the whole silhouette, though - anything claimed by no part is simply missing from
    the dinosaur on screen.

    The QR occupies (1040,640)-(1160,760) plus a 20px quiet zone. The artwork leaves
    that corner empty, so no polygon reaches into it.
  -->
  <g id="parts">
    <polygon id="part-legRearFar" data-parent="body" data-pivot="412,470" data-z="0"
      points="368,412 470,412 476,570 470,616 462,700 372,700 360,616 356,570"/>

    <polygon id="part-legFrontFar" data-parent="body" data-pivot="712,458" data-z="1"
      points="636,400 790,400 796,570 790,616 782,700 644,700 632,616 628,570"/>

    <polygon id="part-tail" data-parent="body" data-pivot="392,452" data-z="2"
      points="44,436 150,392 268,330 366,296 440,300 448,420 444,532 300,540 150,520 40,492"/>

    <polygon id="part-body" data-parent="" data-pivot="560,390" data-z="3"
      points="316,300 392,236 520,182 660,176 760,206 812,268 836,352 840,446 816,530 700,566 520,574 400,552 340,486 312,404"/>

    <polygon id="part-frill" data-parent="body" data-pivot="762,398" data-z="4"
      points="706,268 726,180 790,128 872,126 920,178 932,268 926,352 892,418 812,438 736,414"/>

    <polygon id="part-head" data-parent="frill" data-pivot="900,360" data-z="5"
      points="838,250 900,200 1000,172 1080,168 1160,205 1158,300 1112,330 1150,382 1142,468 1084,540 978,536 884,492 836,420 830,330"/>

    <polygon id="part-legRearNear" data-parent="body" data-pivot="552,474" data-z="6"
      points="450,416 634,416 640,570 634,618 626,700 484,700 466,618 462,570"/>

    <polygon id="part-legFrontNear" data-parent="body" data-pivot="834,450" data-z="7"
      points="772,392 898,392 906,570 898,618 890,700 782,700 768,618 764,570"/>
  </g>
</svg>
