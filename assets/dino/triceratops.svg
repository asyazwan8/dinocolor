<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!--
    Dino Colourise - Triceratops colouring line art AND rig source.

    Every path in #parts is a riggable body part. data-pivot is the joint it rotates
    about, in canonical texture pixels; data-parent is its bone parent; data-z is the
    draw order back to front. scripts/buildRig.ts reads this one file and emits the
    rig JSON, the line-art layer and the per-part alpha masks.

    Parts overlap at joints on purpose: fills are opaque white, so draw order occludes
    the seam in print and the same ordering hides it at runtime. Keep joint overlap
    modest - anything hidden here is unpainted if a rotation later reveals it.

    The QR occupies (1040,640)-(1160,760) plus a 20px quiet zone. Nothing may be drawn
    inside x>=1020 AND y>=620. The head clears it by sitting high; the legs by
    stopping well to the left.
  -->
  <g id="parts" fill="#ffffff" stroke="#111111" stroke-width="7"
     stroke-linejoin="round" stroke-linecap="round">
    <path id="part-legRearFar" data-parent="body" data-pivot="288,452" data-z="0"
      d="M 240,474
         Q 244,444 279,442
         Q 318,440 328,472
         C 336,508 328,553 325,594
         C 323,620 327,641 327,650
         C 327,661 313,668 293,668
         C 274,668 260,661 260,650
         C 260,638 262,618 260,594
         C 255,553 240,508 240,474
         Z"/>

    <path id="part-legFrontFar" data-parent="body" data-pivot="534,452" data-z="1"
      d="M 486,474
         Q 490,444 525,442
         Q 564,440 574,472
         C 582,508 574,553 571,594
         C 569,620 573,641 573,650
         C 573,661 559,668 539,668
         C 520,668 506,661 506,650
         C 506,638 508,618 506,594
         C 501,553 486,508 486,474
         Z"/>

    <path id="part-tail" data-parent="body" data-pivot="266,392" data-z="2"
      d="M 262,344 C 214,338 154,352 106,376 C 80,388 64,404 66,416
         C 78,422 104,416 128,412 C 180,404 234,412 270,428
         C 284,400 278,368 262,344 Z"/>

    <path id="part-body" data-parent="" data-pivot="450,380" data-z="3"
      d="M 240,400 C 246,336 284,296 348,278 C 432,256 528,258 598,282
         C 638,296 662,324 668,358 C 674,400 664,446 642,472
         C 570,494 400,498 296,484 C 256,476 234,444 240,400 Z"/>

    <path id="part-frill" data-parent="body" data-pivot="706,418" data-z="4"
      d="M 660,424 C 632,382 624,322 636,268 C 650,216 680,176 722,156
         A 27,27 0 0 1 774,150 A 27,27 0 0 1 826,162
         A 27,27 0 0 1 866,194 C 886,224 894,268 892,312
         C 890,352 880,388 864,412 C 830,434 772,438 726,432
         C 698,428 674,427 660,424 Z"/>

    <path id="part-head" data-parent="frill" data-pivot="800,340" data-z="5"
      d="M 792,262 C 814,244 840,236 864,238
         C 880,212 906,186 934,170 C 946,163 954,164 954,172
         C 954,186 938,208 916,228 C 906,237 896,244 888,250
         C 906,248 924,250 938,256
         C 950,232 970,208 992,194 C 1002,188 1009,190 1008,199
         C 1006,213 992,234 974,252
         C 984,262 994,276 1000,292
         C 1006,278 1014,270 1020,274 C 1022,284 1016,298 1008,308
         C 1014,322 1016,338 1012,350
         C 1020,358 1024,370 1019,380 C 1012,392 996,398 980,395
         C 966,392 956,384 950,372
         C 914,388 866,400 820,400 C 792,400 774,386 770,360
         C 762,326 762,288 792,262 Z"/>

    <path id="part-legRearNear" data-parent="body" data-pivot="416,458" data-z="6"
      d="M 362,478
         Q 366,444 406,442
         Q 450,440 462,476
         C 470,516 462,566 458,612
         C 456,640 460,664 460,674
         C 460,686 444,694 422,694
         C 400,694 384,686 384,674
         C 384,660 386,638 384,612
         C 378,566 362,516 362,478
         Z"/>

    <path id="part-legFrontNear" data-parent="body" data-pivot="662,458" data-z="7"
      d="M 608,478
         Q 612,444 652,442
         Q 696,440 708,476
         C 716,516 708,566 704,612
         C 702,640 706,664 706,674
         C 706,686 690,694 668,694
         C 646,694 630,686 630,674
         C 630,660 632,638 630,612
         C 624,566 608,516 608,478
         Z"/>
  </g>

  <!--
    Interior detail. Drawn into the line-art layer only, never into the masks, so a
    child gets an eye and toes to colour around without those lines cutting the
    silhouette into extra pieces.
  -->
  <g id="details" fill="none" stroke="#111111" stroke-width="5"
     stroke-linejoin="round" stroke-linecap="round">
    <circle cx="884" cy="302" r="12" fill="#111111" stroke="none"/>
    <path d="M 998,320 C 1004,316 1010,319 1011,325"/>
    <path d="M 956,362 C 970,370 984,373 998,371"/>
    <path d="M 800,286 C 824,268 852,260 878,264"/>

    <path d="M 720,208 C 746,188 776,180 808,184"/>
    <path d="M 690,274 C 722,252 760,242 800,246"/>
    <path d="M 684,342 C 714,322 750,314 788,318"/>
    <path d="M 694,398 C 720,386 748,381 776,383"/>

    <path d="M 275,650 L 275,664 M 293,650 L 293,664 M 312,650 L 312,664"/>
    <path d="M 521,650 L 521,664 M 539,650 L 539,664 M 558,650 L 558,664"/>
    <path d="M 401,676 L 401,690 M 422,676 L 422,690 M 443,676 L 443,690"/>
    <path d="M 647,676 L 647,690 M 668,676 L 668,690 M 689,676 L 689,690"/>

    <path d="M 144,392 C 184,384 226,386 260,396"/>
  </g>
</svg>
