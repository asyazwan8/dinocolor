<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"
     data-artwork="/assets/dino/triceratops.png">
  <!--
    Dino Colourise - Triceratops parts.

    The printed artwork is the PNG named in data-artwork. This file draws nothing. It
    says where each moving part STARTS, and lets the artist's own lines say where it
    ends: buildRig floods outward from each seed through the drawing's interior, and
    the printed outlines stop it. A part boundary is therefore always a line somebody
    drew, never one we invented - which is the whole lesson of the last four attempts.

    The one boundary the drawing does not provide is between the body and the legs,
    because the belly line is interrupted wherever a leg meets it. `cut-belly` closes
    those gaps. It is traced just ON the belly ink, and buildRig offsets it downwards a
    few pixels so that the ink itself stays with the BODY - a belly line that swung
    with a leg would be the very artefact this is meant to remove.

    DRAW ORDER IS THE DESIGN. data-z stacks the parts, and every moving part sits
    BEHIND the body:

        far legs -> near legs -> body (+tail) -> head

    A leg's top is cut somewhere inside the torso, and the body is painted over it, so
    that cut can never be seen at any angle. The head is the exception: it is drawn in
    front, which is allowed only because the frill gives it a real drawn outline to be
    bounded by. The tail has no such line, so it rides with the body for now.

    NEAR AND FAR, read off the drawing rather than assumed: the near legs are drawn
    lower and larger. Measured from the silhouette, the left rear foot bottoms at y=744
    and the right at y=712, so the left one is the near one - the opposite of what this
    file said through revisions 4 to 7, which had the diagonal gait pairing the wrong
    limbs together.
  -->

  <!-- The belly, traced along the drawn line. Canonical pixels. -->
  <polyline id="cut-belly" points="361,485 380,479 450,500 521,522 593,538 629,544
                                   671,536 736,518 807,498 861,484 896,479 941,487"/>

  <g id="parts">
    <circle id="part-legRearFar" data-parent="body" data-z="1"
            data-pivot="563,513" cx="562" cy="589" r="5"/>

    <circle id="part-legFrontFar" data-parent="body" data-z="2"
            data-pivot="836,475" cx="838" cy="589" r="5"/>

    <circle id="part-legRearNear" data-parent="body" data-z="3"
            data-pivot="447,482" cx="441" cy="607" r="5"/>

    <circle id="part-legFrontNear" data-parent="body" data-z="4"
            data-pivot="727,504" cx="727" cy="616" r="5"/>

    <circle id="part-body" data-parent="" data-z="5"
            data-pivot="560,390" cx="520" cy="360" r="5"/>

    <circle id="part-head" data-parent="body" data-z="6"
            data-pivot="718,420" cx="843" cy="268" r="5"/>
  </g>
</svg>
