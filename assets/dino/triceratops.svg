<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"
     data-artwork="/assets/dino/triceratops.png">
  <!--
    Dino Colourise - Triceratops skeleton.

    The printed artwork is the PNG named in data-artwork. This file does not draw the
    dinosaur and no longer cuts it up either: the drawing stays whole, and these
    polygons only say which bone each region of it belongs to.

    That is a weight SEED, not a boundary. buildRig gives every mesh vertex a hard
    owner from these polygons, then relaxes the field across neighbouring vertices
    until the hand-offs become gradients. So a polygon has to be roughly right about
    which limb a region belongs to, and nothing more - a few pixels either way simply
    shifts where one bone's influence fades into the next.

    The earlier version cut the drawing into eight masks along these same lines, which
    is why the legs looked chopped off: the boundaries were straight lines that exist
    nowhere in the drawing, and rotating a limb swung them across the body. Nothing is
    cut now, so there is no edge to expose.

    Two consequences for how they are drawn. Leg polygons stop at the upper thigh
    rather than reaching into the belly - claiming torso would make the belly swing
    with the leg. And the frill is part of the head, not its own bone: on a real
    Triceratops the frill IS the skull, so a joint there could only ever wobble.

    data-z is a tiebreak for overlaps only; limbs sit above the body so a thigh
    overlapping the torso resolves to the limb.
  -->
  <g id="parts">
    <polygon id="part-tail" data-parent="body" data-pivot="360,430" data-z="2"
      points="44,436 132,398 250,334 344,300 404,306 412,420 404,512 300,532 150,520 40,492"/>

    <polygon id="part-body" data-parent="" data-pivot="560,390" data-z="3"
      points="316,300 392,236 520,182 660,176 760,206 812,268 836,352 840,446
              816,530 700,566 520,574 400,552 340,486 312,404"/>

    <polygon id="part-legRearFar" data-parent="body" data-pivot="413,529" data-z="4"
      points="358,529 376,474 451,474 469,529 447,591 452,654 343,654 347,591"/>

    <polygon id="part-legFrontFar" data-parent="body" data-pivot="716,571" data-z="5"
      points="661,571 679,516 753,516 771,571 754,616 759,661 650,661 654,616"/>

    <polygon id="part-legRearNear" data-parent="body" data-pivot="567,571" data-z="6"
      points="512,571 530,515 604,515 622,571 605,625 610,680 499,680 504,625"/>

    <polygon id="part-legFrontNear" data-parent="body" data-pivot="880,517" data-z="7"
      points="825,517 843,462 918,462 936,517 941,597 946,677 835,677 840,597"/>

    <polygon id="part-head" data-parent="body" data-pivot="718,420" data-z="8"
      points="684,300 700,190 770,124 880,120 946,170 1040,164 1160,200 1156,300
              1110,328 1152,380 1144,470 1086,542 970,540 880,486 812,452 700,424"/>
  </g>
</svg>
